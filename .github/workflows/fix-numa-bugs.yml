name: Fix Numa bugs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Numa
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace(
              'function openTransactionModal(editId) {',
              'function openTransactionModal(editId, typeOverride) {'
          )
          s = s.replace(
              '  const editing = editId ? state.data.transactions.find(t => t.id === editId) : null;\n  render(editing?.type || "despesa");',
              '  const editing = editId ? state.data.transactions.find(t => t.id === editId) : null;\n  window.__numaEditingTransactionId = editId || null;\n  render(typeOverride || editing?.type || "despesa");'
          )
          s = s.replace('onclick="render(\'despesa\')"', 'onclick="switchTransactionType(\'despesa\')"')
          s = s.replace('onclick="render(\'receita\')"', 'onclick="switchTransactionType(\'receita\')"')

          marker = 'function openTransactionModal(editId, typeOverride) {'
          helper = '''function switchTransactionType(type) {\n  openTransactionModal(window.__numaEditingTransactionId || null, type);\n}\n\n'''
          if helper not in s and marker in s:
              s = s.replace(marker, helper + marker, 1)

          old_theme = '''function toggleTheme() {\n  const next = isDark() ? "light" : "dark";\n  document.documentElement.setAttribute("data-theme", next);\n  localStorage.setItem("numa-theme", next);\n  renderApp();\n}'''
          new_theme = '''function toggleTheme() {\n  const next = isDark() ? "light" : "dark";\n  const root = document.documentElement;\n  root.setAttribute("data-theme", next);\n  root.style.colorScheme = next;\n  try { localStorage.setItem("numa-theme", next); } catch (e) {}\n  requestAnimationFrame(() => renderApp());\n}'''
          s = s.replace(old_theme, new_theme)

          if s == original:
              raise SystemExit('No expected patterns were found; refusing to create a no-op commit.')

          p.write_text(s, encoding='utf-8')

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair receita switch and theme toggle"
          git push